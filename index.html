<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Get Backend Code</h1>

    <textarea type="text" id="userStory" placeholder="Enter your user story..."></textarea>
    <button onclick="getBackendCode()">Get Code</button>

    <pre id="codeOutput"></pre>

    <script>
        async function getBackendCode() {
            const userStory = document.getElementById('userStory').value;
            const response = await fetch('/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: userStory
            });
            const code = await response.text();
            document.getElementById('codeOutput').textContent = code;
        }
    </script>
</body>
</html>
